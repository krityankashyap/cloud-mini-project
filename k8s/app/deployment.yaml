# Task 4 — command-parser Deployment in namespace "app".
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-parser
  namespace: app
  labels: {app: command-parser}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # keep full capacity during rolling updates (Task 4: <=0.5% failures)
      maxSurge: 1
  selector:
    matchLabels: {app: command-parser}
  template:
    metadata:
      labels: {app: command-parser}
    spec:
      containers:
        - name: service
          image: command-parser:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8000, name: http}
          env:
            - {name: MODEL_URI, value: "s3://models/v1"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs-s3.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - {name: FAULT_INJECT, value: "0"}
            - {name: SCHEMA_PATH, value: "/app/schema.json"}
            # Pin torch threads to the CPU budget. The Linux aarch64 torch wheel uses a
            # generic BLAS (no Apple AMX), so inference is compute-bound; 4 threads on a
            # 4-CPU limit keeps p95 well under the 5s target.
            - {name: TORCH_THREADS, value: "4"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: S3_SECRET_KEY}}
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "4", memory: "1Gi"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60   # allow time to download + load the model before giving up
