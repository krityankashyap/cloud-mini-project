# Task 4 — Ingress routing /parse to the command-parser Service (Traefik, bundled with k3s).
# Reachable at http://localhost:8080/parse via the k3d port mapping (8080:80).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser
  namespace: app
  annotations:
    ingressClassName: traefik
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: command-parser
                port:
                  number: 8000
