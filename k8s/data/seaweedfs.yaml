# Task 1 — SeaweedFS object storage in namespace "data".
# The S3 identity config and the S3 credentials come from Secrets created at deploy
# time by scripts/gen_secrets.sh (never committed to git).
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels: {app: seaweedfs}
spec:
  replicas: 1
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.68
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=1024
            - -volume.max=100
          ports:
            - {containerPort: 8333, name: s3}
            - {containerPort: 8888, name: filer}
            - {containerPort: 9333, name: master}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe:
            httpGet: {path: /status, port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3config
          secret:
            secretName: seaweedfs-s3-config   # created by scripts/gen_secrets.sh, key: s3.json
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: data
spec:
  selector: {app: seaweedfs}
  ports:
    - {port: 8333, targetPort: 8333, name: s3}
    - {port: 8888, targetPort: 8888, name: filer}
    - {port: 9333, targetPort: 9333, name: master}
